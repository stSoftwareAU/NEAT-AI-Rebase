[package]
name = "neat-ai-rebase"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Rebase portable NEAT-AI improvements onto the latest champion and let the scorer decide."
repository = "https://github.com/stSoftwareAU/NEAT-AI-Rebase"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
tempfile = "3"
