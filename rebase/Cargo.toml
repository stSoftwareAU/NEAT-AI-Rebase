[package]
name = "neat-ai-rebase"
version = "0.1.1"
edition = "2024"
license = "Apache-2.0"
description = "Rebase portable NEAT-AI improvements onto the latest champion and let the scorer decide."
repository = "https://github.com/stSoftwareAU/NEAT-AI-Rebase"
readme = "../README.md"

[lints]
workspace = true

[lib]
name = "neat_ai_rebase"
path = "src/lib.rs"

[[bin]]
name = "neat_ai_rebase"
path = "src/main.rs"

[dependencies]
# Pinned to a NEAT-AI-core *release* tag, not a sibling checkout (Issue #107):
# the workspace builds anywhere, and the pin moves only through this
# repository's own PR — `scripts/family-pins.sh`, run by
# `.github/workflows/version-increment.yml`, rewrites the tag below to core's
# newest release and re-locks `Cargo.lock` in the same commit as the bump.
neat-core = { git = "https://github.com/stSoftwareAU/NEAT-AI-core", tag = "v0.22.5" }
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"

[dev-dependencies]
tempfile = "3"
