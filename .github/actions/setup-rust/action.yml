# Install the pinned Rust toolchain (Issue #125).
#
# The one place the `dtolnay/rust-toolchain` SHA and the toolchain version
# live: a bump here reaches every workflow that builds or runs Cargo. Keep
# `toolchain` in step with the `channel` in `rust-toolchain.toml`, which pins
# it for anything run inside the checkout anyway.
#
# Checkout is deliberately NOT part of this action: a local action only exists
# once the repository is checked out, so each workflow checks out first — with
# its own `ref` and `persist-credentials` — and then calls this.
name: Set up Rust
description: Install the pinned Rust toolchain, plus any extra components.

inputs:
  components:
    description: Comma-separated extra components to install, e.g. "rustfmt, clippy".
    required: false
    default: ""

runs:
  using: composite
  steps:
    - name: Install Rust toolchain
      uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable, frozen 2026-05-18
      with:
        toolchain: "1.98.0"
        components: ${{ inputs.components }}
