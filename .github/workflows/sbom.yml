# CycloneDX SBOM publication for NEAT-AI-Rebase (Issue #96).
#
# `rebase/Cargo.toml` builds a binary crate in a public repository, and nothing
# in the tree told a downstream consumer what that binary is built from: no
# SBOM was committed and no workflow produced one, so the dependency graph had
# to be resolved by hand from `Cargo.lock`. This job runs
# `scripts/generate-sbom.sh` — the same script a maintainer runs locally, so
# the gate and the workflow cannot drift — and uploads what it wrote as a build
# artefact.
#
# The SBOM is deliberately *not* committed: it is derived from `Cargo.lock` and
# `cargo metadata`, so a checked-in copy is stale the moment a dependency moves
# and a reviewer cannot tell a stale one from a current one. The artefact is
# regenerated on every pull request and weekly on the schedule instead.
#
# `cargo cyclonedx` resolves the workspace through `cargo metadata`, which
# needs no sibling checkout: `neat-core` is a git dependency pinned to a
# NEAT-AI-core release tag (Issue #107), so the runner fetches it like any
# other dependency.
#
# Third-party actions are pinned to 40-character commit SHAs, matching
# `ci.yml`, `cargo-audit.yml` and `semgrep.yml`, so a hijacked tag cannot
# execute here, and `contents: read` is the whole permission set: the job reads
# the checkout and writes nothing back. Unlike `cargo-audit.yml`, the scheduled
# run needs no failure-routing job of its own — the same job runs on every pull
# request, so a break arrives in front of an author rather than waiting for
# Monday. `rebase/tests/sbom_gate.rs` holds all of this.
name: SBOM

on:
  pull_request:
    # `*` stops at a `/`, so it matches `Develop` but never
    # `milestone/<slug>` — the shared branch milestone sub-issue PRs target.
    # `milestone/*` is listed explicitly so those PRs refresh the SBOM as they
    # merge, rather than only when the rollup PR reaches the default branch.
    # `rebase/tests/workflow_branch_filters.rs` holds this.
    branches: ["*", "milestone/*"]
  schedule:
    # 07:00 UTC every Monday — an hour after `cargo-audit.yml`, so the weekly
    # SBOM describes the dependency set that audit has just judged.
    - cron: "0 7 * * 1"
  workflow_dispatch:

permissions:
  contents: read

# Matches `ci.yml`, `cargo-audit.yml` and `semgrep.yml` (Issue #85): a
# `synchronize` push cancels the superseded run rather than leaving it to
# publish an artefact for a head nobody is reviewing.
concurrency:
  group: sbom-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  # Skip the expensive jobs below on a docs-only PR (Issue #123). The gate is
  # job-level, never a workflow `paths:` filter: a skipped job still reports
  # success to branch protection, a workflow that never runs reports nothing
  # and blocks the merge. It fails open — on schedule, dispatch or a failed
  # classification the output is empty, which is not 'false', so every job
  # runs. `rebase/tests/workflow_change_gates.rs` holds this.
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pull-requests: read
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - name: Classify changed paths
        id: filter
        if: github.event_name == 'pull_request'
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          # Anything outside `docs/**` and the Markdown pages is code.
          predicate-quantifier: every
          filters: |
            code:
              - '**'
              - '!docs/**'
              - '!**/*.md'

  sbom:
    name: CycloneDX SBOM
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.code != 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      # The job only reads the working tree — no fetch, no push — so no git
      # credential needs to survive this step.
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The shared pinned toolchain (`.github/actions/setup-rust`).
      - name: Install Rust toolchain
        uses: ./.github/actions/setup-rust

      # Prebuilt binary at an exact version, the way `ci.yml` installs
      # cargo-deny and `cargo-audit.yml` installs cargo-audit: an unpinned
      # version would let a future release change what this job emits without a
      # diff.
      - name: Install cargo-cyclonedx (prebuilt binary)
        uses: taiki-e/install-action@7a79fe8c3a13344501c80d99cae481c1c9085912 # v2.81.10
        with:
          tool: cargo-cyclonedx@0.5.9

      # Exits non-zero when no SBOM was produced, or when what was produced is
      # not a CycloneDX document naming cargo components.
      - name: Generate the SBOM
        run: ./scripts/generate-sbom.sh

      # `if-no-files-found: error` is the second half of the same guard: an
      # upload with nothing to upload must fail the job, not publish an empty
      # artefact that reads as a successful run.
      - name: Upload the SBOM
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sbom-${{ github.sha }}
          path: sbom/
          if-no-files-found: error
          retention-days: 90
