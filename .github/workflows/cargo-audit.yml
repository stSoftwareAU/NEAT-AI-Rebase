# Cargo security audit for NEAT-AI-Rebase (Issue #17).
#
# Audits the committed `Cargo.lock` against the RustSec advisory database on
# every pull request *and* on a weekly schedule. The schedule is the part
# `ci.yml` cannot cover: `cargo deny check` only runs when someone opens a PR,
# so an advisory published against an already-resolved dependency goes
# unnoticed until the next PR happens to land. This job finds it on the
# following Monday with no code change at all.
#
# `cargo audit` reads `Cargo.lock` directly — it never resolves or builds the
# workspace, so it needs no toolchain beyond the one it installs.
# Third-party actions are pinned to 40-character
# commit SHAs, matching `ci.yml`, `dependency-review.yml` and `markdown-lint.yml`,
# so a hijacked tag cannot execute here, and `contents: read` is the whole
# permission set: the job reads the checkout and writes nothing back.
#
# A scheduled failure is routed to a human by the `notify` job below
# (Issue #94): the Monday run has no pull request and no author, so without it
# a new advisory shows up only as a red tick on the Actions tab. `SECURITY.md`
# names who triages the issue it opens.
name: Cargo Audit

on:
  pull_request:
    # `*` stops at a `/`, so it matches `Develop` but never
    # `milestone/<slug>` — the shared branch milestone sub-issue PRs target.
    # `milestone/*` is listed explicitly so those PRs are audited as they
    # merge, rather than only when the rollup PR reaches the default branch
    # (Issue #59). `rebase/tests/workflow_branch_filters.rs` holds this.
    branches: ["*", "milestone/*"]
  schedule:
    # 06:00 UTC every Monday.
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cargo-audit-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  audit:
    name: Cargo Audit
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      # The audit only reads the working tree — no fetch, no push — so no git
      # credential needs to survive this step.
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Same pin and same version as `ci.yml`. `rust-toolchain.toml` pins the
      # channel for anything run inside the checkout, so installing `stable`
      # here would just make rustup download 1.98.0 a second time.
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable, frozen 2026-05-18
        with:
          toolchain: "1.98.0"

      # Prebuilt binary at an exact version, the way `ci.yml` installs
      # cargo-deny. `cargo install cargo-audit` would rebuild the auditor from
      # source on every run, and an unpinned version would let a future release
      # change what this gate enforces without a diff.
      - name: Install cargo-audit (prebuilt binary)
        uses: taiki-e/install-action@7a79fe8c3a13344501c80d99cae481c1c9085912 # v2.81.10
        with:
          tool: cargo-audit@0.22.2

      # Exits non-zero on any RustSec advisory affecting a locked dependency.
      # cargo-audit does not read `deny.toml`: an advisory that genuinely
      # cannot be fixed is silenced by ID in `.cargo/audit.toml`
      # (`[advisories] ignore`), and the same ID belongs in `deny.toml` so both
      # gates agree. No such exception exists today.
      - name: cargo audit
        run: cargo audit

  # Failure routing (Issue #94). Nobody is watching the 06:00 UTC Monday run,
  # so a red `audit` job needs to arrive somewhere a maintainer is notified —
  # an issue does that, and it stays open until someone triages it.
  #
  # `pull_request` failures are deliberately excluded: those already block the
  # merge in front of the author, and filing an issue for each one would train
  # maintainers to ignore the channel. The job never checks the repository out,
  # so `issues: write` is the whole permission set and the `audit` job above
  # keeps its read-only token.
  notify:
    name: Report audit failure
    needs: audit
    if: failure() && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write

    steps:
      # Every workflow value arrives through `env:` rather than being
      # interpolated into the script, so nothing GitHub supplies can be read as
      # shell. `set -euo pipefail` makes a failed `gh` call fail this job: a
      # notification that dies quietly is worse than no notification at all.
      - name: Open or update the audit triage issue
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail

          title="cargo audit failed on the scheduled run"
          # Plain prose, no backticks: a Markdown code span in single quotes
          # reads as a command substitution to shellcheck (SC2016).
          body="$(printf '%s\n\n%s\n\n%s\n' \
            "cargo audit failed against the committed Cargo.lock — a RustSec advisory now affects a locked dependency, or the audit itself could not run." \
            "Run: $RUN_URL" \
            "Triage owner and the response this expects: see the Internal escalation section of SECURITY.md.")"

          # One issue per outage, not one per Monday: while it is open the
          # weekly result is appended as a comment instead.
          existing="$(gh issue list --state open --search "\"$title\" in:title" \
            --json number --jq '.[0].number // empty')"

          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body "$body"
          else
            gh issue create --title "$title" --body "$body"
          fi
