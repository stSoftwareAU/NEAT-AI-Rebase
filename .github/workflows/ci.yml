# Quality gate for NEAT-AI-Rebase (Issue #10).
#
# Deliberately smaller than the Forests/Ockham fleet of workflows: one job that
# runs the three checks the issue asks for — `cargo fmt --check`,
# `cargo clippy --all-targets --all-features -- -D warnings` and
# `cargo test --all` — plus the licence/advisory audit and a doc build, on
# every PR into `Develop` or a `milestone/<slug>` branch.
name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened]
    # `milestone/*` is listed explicitly because a workflow branch glob `*`
    # stops at a `/`: without it, the sub-issue PRs that target a shared
    # `milestone/<slug>` branch merge with no quality gate at all, and the gap
    # only surfaces when the rollup PR reaches `Develop` (Issue #60).
    # `rebase/tests/workflow_branch_filters.rs` holds this.
    branches:
      - Develop
      - milestone/*
  # No `push:` trigger: this is a checker, not a deploy. As a required status
  # check it already gates every merge on the PR, so re-running it on the push
  # to `Develop` only duplicates that run — wasted CI minutes, and a red tick
  # on the default branch for a check that already passed (Issue #57).
  # `rebase/tests/workflow_push_triggers.rs` holds this.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  # Skip the expensive jobs below on a docs-only PR (Issue #123). The gate is
  # job-level, never a workflow `paths:` filter: a skipped job still reports
  # success to branch protection, a workflow that never runs reports nothing
  # and blocks the merge. It fails open — on schedule, dispatch or a failed
  # classification the output is empty, which is not 'false', so every job
  # runs. `rebase/tests/workflow_change_gates.rs` holds this.
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pull-requests: read
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - name: Classify changed paths
        id: filter
        if: github.event_name == 'pull_request'
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          # Anything outside `docs/**` and the Markdown pages is code.
          predicate-quantifier: every
          filters: |
            code:
              - '**'
              - '!docs/**'
              - '!**/*.md'

  quality:
    name: Quality Checks
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.code != 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      RUSTFLAGS: "-D warnings"

    steps:
      # No sibling NEAT-AI-core checkout: `neat-core` is a git dependency
      # pinned to a core release tag (Issue #107), so this job builds the
      # workspace from the checkout alone. A breaking core release reaches the
      # repository only when `scripts/family-pins.sh` moves the pin on a PR,
      # and this build is what fails on it.
      - name: Checkout code
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd  # v5
        with:
          persist-credentials: false

      # The pinned toolchain lives in `.github/actions/setup-rust`; the gate
      # also needs these components.
      - name: Install Rust toolchain
        uses: ./.github/actions/setup-rust
        with:
          components: rustfmt, clippy

      - name: Cache dependencies
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae  # v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock', '**/Cargo.toml') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Install cargo-deny (prebuilt binary)
        uses: taiki-e/install-action@7a79fe8c3a13344501c80d99cae481c1c9085912  # v2.81.10
        with:
          tool: cargo-deny

      - name: cargo deny
        run: cargo deny check

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run linter
        run: |
          set -euo pipefail
          cargo clippy --workspace --all-targets --all-features -- \
            -D warnings \
            -D clippy::filter_next \
            -D clippy::collapsible_if

      - name: Build workspace
        run: cargo build --workspace

      - name: Run tests
        run: cargo test --workspace --all-features -q

      - name: Build documentation
        run: RUSTDOCFLAGS="-D warnings" cargo doc --workspace --no-deps

  shell-checks:
    name: Shell Script Quality
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.code != 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd  # v5
        with:
          persist-credentials: false

      - name: Check bash script syntax
        run: |
          set -euo pipefail
          while IFS= read -r script; do
            bash -n "$script"
            echo "OK $script"
          done < <(find . -name "*.sh" -not -path "./target/*" -not -path "./.git/*")

      - name: Run ShellCheck
        env:
          SHELLCHECK_OPTS: -s bash
        run: |
          set -euo pipefail
          shellcheck --version
          scripts=()
          while IFS= read -r script; do
            scripts+=("$script")
          done < <(find . -name "*.sh" -not -path "./target/*" -not -path "./.git/*")
          if [ ${#scripts[@]} -eq 0 ]; then
            echo "No shell scripts found — nothing to lint"
            exit 0
          fi
          shellcheck --severity=warning "${scripts[@]}"

      - name: Check scripts/runlib.sh already-installed contract
        run: ./scripts/test-runlib.sh

  ci-required:
    name: CI Required Checks
    needs: [quality, shell-checks]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify all gating jobs succeeded
        env:
          QUALITY_RESULT: ${{ needs.quality.result }}
          SHELL_CHECKS_RESULT: ${{ needs.shell-checks.result }}
        run: |
          set -euo pipefail
          fail=0
          check() {
            local name="$1" result="$2"
            if [[ "$result" == "success" || "$result" == "skipped" ]]; then
              echo "OK   $name: $result"
            else
              echo "FAIL $name: $result" >&2
              fail=1
            fi
          }
          check "quality"      "$QUALITY_RESULT"
          check "shell-checks" "$SHELL_CHECKS_RESULT"
          if [[ "$fail" -ne 0 ]]; then
            echo "One or more gating jobs did not succeed — blocking merge." >&2
            exit 1
          fi
          echo "All gating jobs succeeded — safe to merge."
