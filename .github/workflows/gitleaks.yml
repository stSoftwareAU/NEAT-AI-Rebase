# Gitleaks secrets detection for NEAT-AI-Rebase (Issue #13).
#
# Scans the diff of every pull request for committed secrets. Third-party
# actions are pinned to 40-character commit SHAs, matching `ci.yml`, so a
# hijacked tag cannot exfiltrate CI secrets.
#
# gitleaks-action requires an organisation licence (GITLEAKS_LICENSE) on
# org-owned repositories, and this repository belongs to stSoftwareAU.
# Dependabot-authored PRs are not given Actions secrets, so the licence is
# empty for them and the action exits with ErrLicense. Those licence-less runs
# fall back to the free, open-source gitleaks CLI, which needs no licence —
# the scan still gates the PR either way.
name: Gitleaks

on:
  pull_request:
    branches: ["*"]

permissions:
  contents: read
  pull-requests: read

jobs:
  gitleaks:
    name: Secrets Detection
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Exposed at job level so a step-level `if:` can branch on whether the
    # organisation licence secret is present — the `secrets` context is not
    # available in `if:` conditions, but `env` is.
    env:
      GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}
    steps:
      # `fetch-depth: 0` gives the runner the full history, so the PR commit
      # range `<base_sha>..<head_sha>` resolves. Credentials are left in place
      # (unlike `ci.yml`) because the fetch below re-reads the base branch.
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      # Belt and braces: make sure the base branch tip is on the runner before
      # the range is computed. Fetching into the remote-tracking ref with
      # `--force` is idempotent — it can never collide with a local branch —
      # and a genuine fetch failure fails the job rather than being swallowed.
      - name: Fetch base branch
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          set -euo pipefail
          git fetch --no-tags --force origin \
            "+refs/heads/${BASE_REF}:refs/remotes/origin/${BASE_REF}"

      # Licensed path: when the organisation licence is available, use the
      # upstream action so the licence is applied and PR comments work.
      - name: Gitleaks (licensed action)
        if: env.GITLEAKS_LICENSE != ''
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}

      # Licence-less fallback (for example Dependabot PRs): the free
      # open-source gitleaks CLI needs no licence. It scans the same PR commit
      # range the action would, and the download is checksum-verified before it
      # is unpacked so a tampered release cannot execute here.
      - name: Gitleaks (open-source CLI fallback)
        if: env.GITLEAKS_LICENSE == ''
        env:
          GITLEAKS_VERSION: "8.30.1"
          GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          url="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${archive}"
          curl -sSfL "$url" -o "$archive"
          echo "${GITLEAKS_SHA256}  ${archive}" | sha256sum -c -
          tar -xzf "$archive" gitleaks
          ./gitleaks git --redact --no-banner --exit-code 1 \
            --log-opts="${BASE_SHA}..${HEAD_SHA}" .
