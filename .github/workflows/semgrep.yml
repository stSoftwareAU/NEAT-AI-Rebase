# Semgrep SAST scanning for NEAT-AI-Rebase (Issue #14).
#
# Runs the Semgrep static-analysis gate over every pull request. The scanner
# ships as a container image pinned by digest, and `actions/checkout` is pinned
# to a 40-character commit SHA, matching `ci.yml` and `gitleaks.yml`, so a
# hijacked tag cannot execute here.
#
# `SEMGREP_APP_TOKEN` is optional. When the organisation has one, findings are
# also reported to the Semgrep AppSec Platform; when it is absent — including
# on Dependabot pull requests, which are never given Actions secrets — the
# variable expands to an empty string and `semgrep ci` scans with the
# `p/default` ruleset alone. Either way the scan runs and a blocking finding
# fails the job, so the gate never silently degrades into a no-op.
name: Semgrep

on:
  pull_request:
    # `*` stops at a `/`, so it matches `Develop` but never
    # `milestone/<slug>` — the shared branch milestone sub-issue PRs target.
    # `milestone/*` is listed explicitly so those PRs are scanned as they
    # merge, rather than only when the rollup PR reaches the default branch
    # (Issue #63). `rebase/tests/workflow_branch_filters.rs` holds this.
    branches: ["*", "milestone/*"]

permissions:
  contents: read

# Matches `ci.yml`, `actionlint.yml`, `cargo-audit.yml` and `markdown-lint.yml`
# (Issue #85): a `synchronize` push cancels the superseded scan, so the
# container SAST run — 20 minutes at its timeout — is not left burning CI
# minutes on a head nobody is reviewing.
concurrency:
  group: semgrep-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Skip the expensive jobs below on a docs-only PR (Issue #123). The gate is
  # job-level, never a workflow `paths:` filter: a skipped job still reports
  # success to branch protection, a workflow that never runs reports nothing
  # and blocks the merge. It fails open — on schedule, dispatch or a failed
  # classification the output is empty, which is not 'false', so every job
  # runs. `rebase/tests/workflow_change_gates.rs` holds this.
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pull-requests: read
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - name: Classify changed paths
        id: filter
        if: github.event_name == 'pull_request'
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          # Anything outside `docs/**` and the Markdown pages is code.
          predicate-quantifier: every
          filters: |
            code:
              - '**'
              - '!docs/**'
              - '!**/*.md'

  semgrep:
    name: SAST Scan
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.code != 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    container:
      image: semgrep/semgrep:1.175.0@sha256:b94b53d02fd4a022f9eac4e2af1380f5c3c4c21400e79d3336bdff1d1db5e796
    steps:
      # `fetch-depth: 0` gives `semgrep ci` the history it needs to resolve the
      # merge base for a diff-aware scan locally, instead of re-fetching the
      # base branch itself mid-scan. Credentials are dropped: this repository
      # is public, so any fetch Semgrep still chooses to make succeeds
      # anonymously.
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Semgrep scan
        env:
          SEMGREP_APP_TOKEN: ${{ secrets.SEMGREP_APP_TOKEN }}
        run: semgrep ci --config p/default
